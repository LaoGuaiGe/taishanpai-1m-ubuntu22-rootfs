# Use case for devices on rockchip,rk809-codec card.

SectionVerb {
    EnableSequence [
		cset "name='Speaker Switch' off"
		cset "name='Headphone Switch' off"
		cset "name='Headset Mic Switch' off"
		cset "name='Main Mic Switch' off"
		cset "name='Speaker Switch' off"
		cset "name='Headphone Switch' off"
		cset "name='Headset Mic Switch' off"
		cset "name='Main Mic Switch' off"
    ]
}

SectionDevice."Speaker" {
    Comment "Speaker"
    ConflictingDevice ["Headphone"]
    
    EnableSequence [
        cset "name='Speaker Switch' on"
        cset "name='Playback Path' SPK"
    ]
    DisableSequence [
        cset "name='Speaker Switch' off"
    ]
    Value {
        PlaybackPCM "hw:rockchiprk809"
        PlaybackPriority 100
    }
}

SectionDevice."Headphone" {
    Comment "Headphone"
    ConflictingDevice ["Speaker"]

    EnableSequence [
        cset "name='Headphone Switch' on"
        cset "name='Playback Path' HP"
    ]
    DisableSequence [
        cset "name='Headphone Switch' off"
    ]
    Value {
        PlaybackPCM "hw:rockchiprk809"
        PlaybackPriority 200
        JackControl "Headphone Jack"
        JackHWMute "Speaker"
    }
}

SectionDevice."Mic" {
    Comment "Internal Microphone"
    
    EnableSequence [
        cset "name='Main Mic Switch' on"
    ]
    DisableSequence [
        cset "name='Main Mic Switch' off"
    ]
    Value {
        CapturePCM "hw:rockchiprk809"
        CapturePriority 100
    }
}